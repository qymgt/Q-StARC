[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qstarc"
version = "1.0.1"
description = "Quantum Estimator Design via Stiefel Adam–RCG Optimization with Certified Risk Bounds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
optimize = ["jax>=0.4.30,<0.12"]
dual = ["cvxpy>=1.6,<2", "clarabel>=0.9,<0.12", "scipy>=1.12,<2"]
all = ["jax>=0.4.30,<0.12", "cvxpy>=1.6,<2", "clarabel>=0.9,<0.12", "scipy>=1.12,<2"]

[tool.setuptools.packages.find]
where = ["src"]
